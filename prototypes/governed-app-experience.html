<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a CRUD admin app. Fixed top bar, left sidebar in three bands (Governance · The machine · Across the machine), scrolling main area, record drawer on the right. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --sunk:#ECEEF3; --side:#EEF0F4; --ink:#141D28; --muted:#566273; --line:#D9DEE6;
  --accent:#2B47A3; --accent-soft:#E5EAF8; --accent-ink:#FFFFFF;
  --ok:#1D7449; --ok-soft:#E1F2E8; --warn:#9A6200; --warn-soft:#FAEFD9; --bad:#AE2F2B; --bad-soft:#FAE4E2;
  --mature:#6A3C9E; --mature-soft:#EFE7F8; --shade:rgba(20,29,40,.35);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px; --sidew:252px; --toph:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --surface:#161E29; --sunk:#1C2633; --side:#121922; --ink:#E6EBF2; --muted:#9AA7B8; --line:#2A3646;
  --accent:#8EA6F2; --accent-soft:#1F2B4A; --accent-ink:#0F151D;
  --ok:#5CC48C; --ok-soft:#16301F; --warn:#E3AE4F; --warn-soft:#33270F; --bad:#F07C76; --bad-soft:#3A1A19;
  --mature:#C4A3EE; --mature-soft:#2A1F3B; --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#161E29; --sunk:#1C2633; --side:#121922; --ink:#E6EBF2; --muted:#9AA7B8; --line:#2A3646;
  --accent:#8EA6F2; --accent-soft:#1F2B4A; --accent-ink:#0F151D;
  --ok:#5CC48C; --ok-soft:#16301F; --warn:#E3AE4F; --warn-soft:#33270F; --bad:#F07C76; --bad-soft:#3A1A19;
  --mature:#C4A3EE; --mature-soft:#2A1F3B; --shade:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--f-body);margin:0;overflow:hidden}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.4rem;font-weight:600}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.98rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font:600 .7rem/1.2 var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82em}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:.84rem}

/* frame */
.app{display:grid;grid-template-rows:var(--toph) minmax(0,1fr);height:100%}
.top{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-width:0}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:32px}
.ent{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.logo{width:24px;height:24px;border-radius:5px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:600 11px var(--f-mono)}
.env{font:600 .66rem var(--f-label);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--bad-soft);color:var(--bad)}
.search{flex:1 1 120px;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px}
.spacer{flex:1}
.sample{font:500 .7rem var(--f-label);letter-spacing:.05em;text-transform:uppercase;border:1px dashed var(--line);color:var(--muted);padding:3px 7px;border-radius:4px;white-space:nowrap}
.role{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px}
.body{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);min-height:0}
@media (max-width:980px){.sample{display:none}}
@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr)}
  .burger{display:inline-grid;place-items:center}
  .side{position:fixed;z-index:30;top:var(--toph);bottom:0;left:0;width:min(86vw,var(--sidew));transform:translateX(-102%);transition:transform .18s ease;box-shadow:0 0 0 1px var(--line)}
  .side.open{transform:none}
  .search,.ent .nm{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 24px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.band{margin-top:14px}
.band:first-child{margin-top:0}
.band-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 6px}
.band-h .label{color:var(--ink)}
.band-h .hint{font:500 .66rem var(--f-label);color:var(--muted);letter-spacing:.04em}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.88rem}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:500}
.nav a .c{font:500 .68rem var(--f-mono);color:var(--muted)}
.nav a .c.hot{color:var(--accent)}
.nav .parent .car{display:inline-block;width:10px;color:var(--muted);transition:transform .15s}
.nav .parent[aria-expanded="true"] .car{transform:rotate(90deg)}
.nav .kids{display:grid;margin:2px 0 4px 14px;padding-left:8px;border-left:1px solid var(--line)}
.nav .kids[hidden]{display:none}
.phase-n{font:600 .66rem var(--f-mono);color:var(--muted);margin-right:6px}
.shade{position:fixed;inset:var(--toph) 0 0 0;background:var(--shade);z-index:20}

/* main */
main{overflow-y:auto;min-width:0}
.page{max-width:1160px;margin:0 auto;display:grid;gap:18px;padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb span+span::before{content:"/";margin-right:6px;color:var(--line)}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.ph .t{display:grid;gap:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tile{display:grid;gap:3px}
.tile .num{font-size:1.7rem;font-weight:600;line-height:1.1}
.tile .sub{color:var(--muted);font-size:.82rem}

.chip{display:inline-flex;align-items:center;gap:5px;font:500 .72rem/1 var(--f-label);letter-spacing:.03em;padding:4px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.mat{background:var(--mature-soft);color:var(--mature)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500;font-size:.86rem;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.done-note{color:var(--ok);font-size:.84rem;font-weight:500}

/* governance strip */
.gstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:.82rem}
.gstrip .sep{color:var(--line)}

/* lists */
.list{display:grid}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
@media (max-width:560px){.item{grid-template-columns:auto minmax(0,1fr)}.item > .btns,.item > .chip{grid-column:2}}
.item .what{font-weight:500}
.item .meta{color:var(--muted);font-size:.84rem}
.stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--line)}
.stripe.ok{background:var(--ok)} .stripe.warn{background:var(--warn)} .stripe.bad{background:var(--bad)} .stripe.mat{background:var(--mature)} .stripe.acc{background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.flash{animation:fl .9s ease-out}@keyframes fl{from{background:var(--accent-soft)}to{background:transparent}}}

/* table (CRUD list) */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 180px;max-width:300px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .7rem var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}

/* drawer */
.drawer{position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--line);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
.drawer[hidden]{display:none}
.dr-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dr-b{overflow-y:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.dr-f{padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.fields{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:.88rem}
.fields dt{color:var(--muted)} .fields dd{margin:0}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:.84rem;color:var(--muted)}
.form input,.form select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;color:var(--ink);width:100%}
textarea{min-height:84px;resize:vertical}
.hist{display:grid;gap:8px;font-size:.82rem}
.hist div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.hist .when{font-family:var(--f-mono);color:var(--muted);font-size:.76rem}
.x{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;flex:none}

/* fab + toast */
.fab{position:fixed;z-index:15;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:9px 15px;background:var(--ink);color:var(--surface);border:0;font-weight:500;font-size:.86rem;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:.86rem;max-width:calc(100vw - 32px)}

/* footer */
.vfoot{color:var(--muted);font:400 .74rem var(--f-mono);display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}

/* diagrams and charts */
.diagram{overflow-x:auto}
.diagram svg{display:block;min-width:820px;width:100%;height:auto}
.n-box{fill:var(--surface);stroke:var(--line)} .n-box.acc{fill:var(--accent-soft);stroke:var(--accent)} .n-box.mat{fill:var(--mature-soft);stroke:var(--mature)}
.n-t{fill:var(--ink);font:600 13px var(--f-body)} .n-s{fill:var(--muted);font:400 11px var(--f-body)} .n-k{fill:var(--muted);font:600 10px var(--f-label);letter-spacing:.08em}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none} .arrow.mat{stroke:var(--mature);stroke-dasharray:5 4}
.ah{fill:var(--muted)} .ah.mat{fill:var(--mature)} .m-t{fill:var(--mature);font:600 12px var(--f-body)}
.bands{display:grid;gap:12px;grid-template-columns:1fr 2fr 2fr}
@media (max-width:900px){.bands{grid-template-columns:minmax(0,1fr)}}
.band-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.band-card ul{margin:0;padding-left:18px;font-size:.88rem}
.machine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.machine div{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:8px;font-weight:500;font-size:.84rem;text-align:center}
.across{display:grid;gap:4px}
.across div{background:var(--sunk);border-radius:4px;padding:5px 8px;font-size:.84rem}
.app-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.86rem}
.app-row:first-of-type{border-top:0}
.scale{position:relative;height:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.scale span{background:var(--sunk);border-radius:2px} .scale span.in{background:var(--ok-soft)}
.scale .res{position:absolute;top:2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--surface);transform:translateX(-50%)}
.scale-axis{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:12px;font:500 .66rem var(--f-label);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.scale-axis .ticks{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
@media (max-width:520px){.app-row,.scale-axis{grid-template-columns:minmax(0,1fr) auto}.app-row .scale,.scale-axis .ticks{grid-column:1 / -1;grid-row:2}}
.route{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.route.on{border-color:var(--accent);background:var(--accent-soft)}
.fb-types{display:flex;flex-wrap:wrap;gap:6px;border:0;padding:0;margin:0}
.fb-types label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.84rem;cursor:pointer;background:var(--surface);color:var(--ink)}
.fb-types input{accent-color:var(--accent);margin:0;width:auto}
.ctx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.ctx dt{color:var(--muted)} .ctx dd{margin:0;font-family:var(--f-mono);font-size:.76rem;overflow-wrap:anywhere}
</style>

<div class="app">
  <header class="top">
    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false">☰</button>
    <span class="ent"><span class="logo">HA</span><span class="nm">Harbour Advisory Ltd ▾</span></span>
    <span class="env" id="env">Production</span>
    <input class="search" id="q" placeholder="Search records, jobs, clauses…" aria-label="Search">
    <span class="spacer"></span>
    <span class="sample">Sample data</span>
    <button class="chip acc" id="actionsChip" style="border:0"><span class="dot"></span><span id="actionsN">4</span> actions</button>
    <label class="label" for="role" style="display:none">Role</label>

      <option value="operator">Operator</option>
      <option value="director">Director</option>
      <option value="crco">CRCO</option>
      <option value="regulator">Regulator (preview)</option>
    </select>
  </header>
  <div class="body">
    <aside class="side" id="side" aria-label="Main menu"></aside>
    <main id="main"></main>
  </div>
</div>
<div class="shade" id="shade" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Record"></aside>
<button class="fab" id="fab" type="button">Improve this</button>
<div class="toast" id="toast" hidden role="status"></div>

/* ---------- sidebar ---------- */
function parentOf(id){var p=null;NAV.forEach(function(b){b.items.forEach(function(it){(it.kids||[]).forEach(function(k){if(k.id===id)p=it.id})})});return p}
function renderSide(){
  var po=parentOf(S.page); if(po)S.open[po]=true;
  var html='';
  (S.role==='regulator'?REG_NAV:NAV).forEach(function(b){
    html+='<div class="band">'+(b.band?'<div class="band-h"><span class="label">'+b.band+'</span><span class="hint">'+b.hint+'</span></div>':'')+'<nav class="nav">';
    b.items.forEach(function(it){
      if(it.kids){
        var open=!!S.open[it.id];
        html+='<a href="#" class="parent" data-toggle="'+it.id+'" aria-expanded="'+open+'"><span><span class="car">▸</span> '+(it.n?'<span class="phase-n">'+it.n+'</span>':'')+it.label+'</span></a>';
        html+='<div class="kids"'+(open?'':' hidden')+'>';
        it.kids.forEach(function(k){html+=link(k)});
        html+='</div>';
      } else html+=link(it);
    });
    html+='</nav></div>';
  });
  $('#side').innerHTML=html;
}
function link(it){return '<a href="#'+it.id+'" data-page="'+it.id+'"'+(S.page===it.id?' class="on" aria-current="page"':'')+'><span>'+it.label+'</span>'+(it.c?'<span class="c'+(it.hot?' hot':'')+'">'+it.c+'</span>':'')+'</a>'}

/* ---------- shared bits ---------- */
function crumb(id){return '<div class="crumb label">'+CRUMB[id].map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>'}
function strip(c){
  var fl=c.flag==='live'?'ok':c.flag==='shadow'?'warn':'';
  return '<div class="gstrip" aria-label="Governance for this page"><span class="chip">Job <b class="mono">'+c.job+'</b>&nbsp;'+esc(c.jobName)+'</span><span class="sep">|</span>'+
   '<span class="chip acc">Level: '+c.level+'</span><span class="chip '+fl+'"><span class="dot"></span>Flag '+c.flag+'</span><span class="sep">|</span>'+
   '<span>Carries out <span class="mono">'+c.clauses+'</span></span><span class="sep">|</span>'+
   '<span class="chip '+c.control[1]+'">'+c.control[0]+'</span><span class="chip '+c.risk[1]+'">Risk '+c.risk[0]+'</span><span class="sep">|</span><span class="note">Last evidence 2 h ago</span></div>';
}
function foot(){return '<div class="vfoot"><span>Plumbline v0.4.0</span><span>Policies effective 2026-10-01</span><span>Build 4f2a91c</span><span>Flags set 2026-10-12</span></div>'}

  '<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th>Viewed</th></tr></thead><tbody>'+
  '<tr><td>21 Oct 09:14</td><td>Supervisor 1</td><td>Overview; Risk and key risk indicators</td></tr><tr><td>20 Oct 16:40</td><td>Supervisor 2</td><td>AI use cases</td></tr><tr><td>20 Oct 16:32</td><td>Supervisor 2</td><td>Evidence integrity (verified #411)</td></tr></tbody></table></div></div>')}
function pRegulatorStaff(){return '<div class="page">'+crumb('regulator')+'<div class="ph"><div class="t"><h1>Regulator view</h1><span class="note">Built and tried internally first. Nobody outside the firm has access.</span></div><div class="btns"><button class="btn primary" id="previewReg">Preview as the regulator</button></div></div>'+
  '<div class="grid g2"><div class="panel"><div class="panel-head"><h2>What the regulator would see</h2></div><div class="list">'+
  item('acc','The same records we run on, read-only','Position against appetite, KRIs, policies and changes, AI use cases, outsourcing, incidents. No separate report to compile.','<span></span>')+
  item('acc','Aggregates by default, detail on request','Client-level records only through a logged request the CRCO answers.','<span></span>')+
  item('acc','Proof the record is intact','A hash-chained evidence log with nightly checkpoints the regulator holds.','<span></span>')+
  item('acc','Their visits are visible to us','Every view is logged and shown to the board and CRCO.','<span></span>')+'</div></div>'+
  '<div class="panel"><div class="panel-head"><h2>Readiness</h2><span class="note">Proposed clauses SUP-1 to SUP-7</span></div><div class="tbl-wrap"><table><thead><tr><th>Clause</th><th>Status</th></tr></thead><tbody>'+
  '<tr><td>SUP-1 Read-only regulator role and routes</td><td>'+stateChip('Draft')+'</td></tr><tr><td>SUP-2 Hash-chained evidence log, nightly checkpoints</td><td><span class="chip warn">Partial</span></td></tr><tr><td>SUP-3 Machine-readable export</td><td><span class="chip">Gap</span></td></tr><tr><td>SUP-4 Aggregates by default; detail by request</td><td><span class="chip warn">Partial</span></td></tr><tr><td>SUP-5 Notification feed</td><td><span class="chip">Gap</span></td></tr><tr><td>SUP-6 Internal preview before any access</td><td><span class="chip ok">Met</span></td></tr><tr><td>SUP-7 Pilot only under written terms</td><td><span class="chip">Not started</span></td></tr></tbody></table></div></div></div>'+
  '<div class="panel"><div class="panel-head"><h2>Path to a pilot</h2></div><div class="tbl-wrap"><table><thead><tr><th>Stage</th><th>What happens</th><th>Gate</th></tr></thead><tbody>'+
  '<tr><td><b>1 Internal preview</b></td><td>Board and CRCO use this view on real data, as the regulator would</td><td>The board is comfortable with what it shows</td></tr><tr><td><b>2 Counsel and board</b></td><td>Confidentiality, data protection and outsourcing reviewed; scope and notification rules written</td><td>Board resolution</td></tr><tr><td><b>3 Demonstration</b></td><td>The regulator sees the view on fictional data</td><td>The regulator wants to go further</td></tr><tr><td><b>4 Pilot</b></td><td>Read-only access through the regulator\'s innovation or sandbox route, limited scope and period</td><td>Written pilot terms</td></tr><tr><td><b>5 Standing access</b></td><td>The view becomes part of how the firm is supervised</td><td>Agreed with the regulator; reviewed yearly</td></tr></tbody></table></div></div>'+foot()+'</div>'}
var REG_NAV=[{band:'Supervisory view',hint:'read-only',items:[{id:'reg-home',label:'Overview'},{id:'reg-risk',label:'Risk and KRIs'},{id:'reg-gov',label:'Governance and changes'},{id:'reg-ai',label:'AI use cases'},{id:'reg-outsourcing',label:'Outsourcing'},{id:'reg-incidents',label:'Incidents',c:'1',hot:true},{id:'reg-integrity',label:'Evidence integrity'},{id:'reg-requests',label:'Requests',c:'1'},{id:'reg-access',label:'Access log'}]}];
REG_NAV[0].items.forEach(function(it){CRUMB[it.id]=['Supervisory view (preview)',it.label]});

var PAGES={home:pHome,regulator:pRegulatorStaff,'reg-home':pRegHome,'reg-risk':pRegRisk,'reg-gov':pRegGov,'reg-ai':pRegAI,'reg-outsourcing':pRegOut,'reg-incidents':pRegInc,'reg-integrity':pRegIntegrity,'reg-requests':pRegRequests,'reg-access':pRegAccess,'gov-overview':pOverview,board:pBoard,changes:pChanges,improvements:pImprovements,'risk-register':pRiskRegister,plumbline:pPlumbline};

/* ---------- render ---------- */
function render(){
  var isReg=S.role==='regulator';
  if(isReg&&S.page.indexOf('reg-')!==0)S.page='reg-home';
  if(!isReg&&S.page.indexOf('reg-')===0)S.page='home';
  $('#env').textContent=isReg?'Supervisory view · preview':'Production';
  $('#fab').hidden=isReg;$('#actionsChip').hidden=isReg;
  renderSide();
  var id=S.page, html;
  if(PAGES[id]) html=PAGES[id]();
  else if(C[id]) html=pCrud(id);
  else html=pParent(id);
  $('#main').innerHTML=html; $('#main').scrollTop=0;
  $('#role').value=S.role; save();
}
function go(id){S.page=id;closeSide();render()}

/* drawer */
function openDrawer(html){$('#drawer').innerHTML=html;$('#drawer').hidden=false;var x=$('#drawer .x');if(x)x.focus()}
function closeDrawer(){$('#drawer').hidden=true}
function recordDrawer(id,i){
  var c=C[id], r=c.rows[i];
  openDrawer('<div class="dr-h"><div><span class="label">'+c.title+' · record</span><h2 style="margin-top:4px">'+esc(r[0])+'</h2></div><button class="x" data-close aria-label="Close">✕</button></div>'+
   '<div class="dr-b"><dl class="fields">'+c.cols.map(function(h,j){return '<dt>'+h+'</dt><dd>'+stateChip(r[j])+'</dd>'}).join('')+'</dl>'+
   '<div><span class="label">Governance</span><div style="margin-top:6px">'+strip(c)+'</div></div>'+
   '<div><span class="label">History (evidence log)</span><div class="hist" style="margin-top:8px"><div><span class="when">19 Oct 11:40</span><span>Updated by Analyst under '+c.clauses.split(' · ')[0]+'</span></div><div><span class="when">12 Oct 09:02</span><span>Created by A. Moore</span></div></div></div></div>'+
   '<div class="dr-f btns">'+(c.readOnly?'<span class="note">Evidence cannot be edited.</span>':'<button class="btn primary" data-edit="'+id+'" data-i="'+i+'">Edit</button><button class="btn" data-close>Close</button>')+'</div>');
}
function formDrawer(id,i){
  var c=C[id]||{title:id==='changes'?'Change':'Risk',cols:id==='changes'?['Change','Level','Why']:['Risk','Owner','Residual']};
  var r=(i!=null&&C[id])?C[id].rows[i]:null;
  openDrawer('<div class="dr-h"><div><span class="label">'+c.title+'</span><h2 style="margin-top:4px">'+(r?'Edit record':'New record')+'</h2></div><button class="x" data-close aria-label="Close">✕</button></div>'+
   '<form class="dr-b form" id="recForm">'+c.cols.map(function(h,j){return '<label for="f'+j+'">'+h+'<input id="f'+j+'" value="'+(r?esc(r[j]):'')+'"></label>'}).join('')+
   '<p class="note">Saving writes an entry to the evidence log with the clause versions in force.</p></form>'+
   '<div class="dr-f btns"><button class="btn primary" id="saveRec" data-id="'+id+'"'+(r?' data-i="'+i+'"':'')+'>Save</button><button class="btn" data-close>Cancel</button></div>');
}
function feedbackDrawer(){
  var c=C[S.page]||{job:'—',jobName:'',level:'—',flag:'—',clauses:'—'};
  openDrawer('<div class="dr-h"><div><span class="label">Improve this page</span><h2 style="margin-top:4px">'+esc((CRUMB[S.page]||['Home']).slice(-1)[0])+'</h2></div><button class="x" data-close aria-label="Close">✕</button></div>'+
   '<form class="dr-b form" id="fbForm"><fieldset class="fb-types"><legend class="label" style="margin-bottom:6px">What kind of feedback?</legend>'+
   ['Something broke','Confusing','Missing','Feels risky','Idea'].map(function(t,i){return '<label><input type="radio" name="t" id="t'+i+'" value="'+i+'"'+(i===3?' checked':'')+'> '+t+'</label>'}).join('')+'</fieldset>'+
   '<label for="fbText">What happened?<textarea id="fbText">The refresh date says 12 months, but I thought high-risk clients are every 6 months now.</textarea></label>'+
   '<dl class="ctx" aria-label="Attached automatically"><dt>Page</dt><dd>/'+S.page+'</dd><dt>Job · level · flag</dt><dd>'+c.job+' · '+c.level+' · '+c.flag+'</dd><dt>Clauses</dt><dd>'+c.clauses+'</dd><dt>Role · entity</dt><dd>'+S.role+' · Harbour Advisory Ltd</dd><dt>Build · Plumbline</dt><dd>4f2a91c · v0.4.0</dd></dl>'+
   '<p class="note">You get an id now and hear back when it changes something. Tonight\'s run sees this without your name.</p></form>'+
   '<div class="dr-f btns"><button class="btn primary" id="sendFb">Send feedback</button><button class="btn" data-close>Cancel</button></div>');
}
function toast(t){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},3200)}

/* side open/close (mobile) */
function closeSide(){$('#side').classList.remove('open');$('#shade').hidden=true;$('#burger').setAttribute('aria-expanded','false')}
$('#burger').addEventListener('click',function(){var o=!$('#side').classList.contains('open');$('#side').classList.toggle('open',o);$('#shade').hidden=!o;this.setAttribute('aria-expanded',String(o))});
$('#shade').addEventListener('click',closeSide);

/* events */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-page],[data-toggle],[data-row],[data-new],[data-edit],[data-close],[data-act],[data-go],#saveRec,#sendFb,#fab,#actionsChip');
  if(!t) return;
  if(t.dataset.page){e.preventDefault();go(t.dataset.page)}
  else if(t.dataset.toggle){e.preventDefault();S.open[t.dataset.toggle]=!S.open[t.dataset.toggle];renderSide();save()}
  else if(t.dataset.row!=null){var tb=t.closest('tbody');recordDrawer(tb.dataset.tbody,+t.dataset.row)}
  else if(t.dataset.new){formDrawer(t.dataset.new,null)}
  else if(t.dataset.edit){formDrawer(t.dataset.edit,+t.dataset.i)}
  else if(t.hasAttribute('data-close')){closeDrawer()}
  else if(t.dataset.act){var box=t.closest('.btns'),it=t.closest('.item,tr');box.innerHTML='<span class="done-note">'+t.dataset.act+' · logged</span>';if(it)it.classList.add('flash')}
  else if(t.dataset.go){go(t.dataset.go)}
  else if(t.id==='saveRec'){e.preventDefault();var id=t.dataset.id,c=C[id];
    if(c){var vals=c.cols.map(function(_,j){var el=$('#f'+j);return el?el.value||'—':'—'});if(t.dataset.i!=null)c.rows[+t.dataset.i]=vals;else c.rows.unshift(vals)}
    closeDrawer();render();toast('Saved · logged to the evidence log')}
  else if(t.id==='sendFb'){e.preventDefault();var ty=($('#fbForm input[name="t"]:checked')||{}).value;var route=['App fix','App fix','App fix','Policy or risk','Idea'][+ty||0];
    if(+ty===3&&/policy|months|rule/i.test($('#fbText').value))route='Procedure';
    closeDrawer();toast('Received as FB-0'+(152+Math.floor(Math.random()*20))+' · tonight it goes to: '+route)}
  else if(t.id==='fab'){feedbackDrawer()}
  else if(t.id==='actionsChip'){go('home')}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeDrawer();closeSide()}
  if(e.key==='Enter'&&e.target.matches('tr[data-row]')){recordDrawer(e.target.closest('tbody').dataset.tbody,+e.target.dataset.row)}
});
document.addEventListener('input',function(e){
  if(e.target.matches('[data-filter]')){var q=e.target.value.toLowerCase();document.querySelectorAll('tbody[data-tbody] tr').forEach(function(tr){tr.hidden=q&&tr.textContent.toLowerCase().indexOf(q)<0})}
});
$('#role').addEventListener('change',function(){S.role=this.value;S.page=S.role==='regulator'?'reg-home':'home';render()});
document.addEventListener('click',function(e){
  if(e.target.id==='previewReg'){S.role='regulator';S.page='reg-home';render()}
  else if(e.target.id==='sendReq'){e.preventDefault();toast('Request sent to the CRCO · logged on both sides')}
  else if(e.target.id==='verifyChain'){e.target.disabled=true;e.target.textContent='Verified';toast('Chain recomputed for checkpoints #410 to #412 · all roots match')}
});
render();
})();
</script>
